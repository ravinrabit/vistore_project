{# Card de indicador dos painéis. Parâmetros: titulo, valor, icone, cor (primary|warning|danger|success), url (opcional) #}
<div class="col-6 col-lg-3">
  <div class="card card-indicador card-indicador--{{ cor|default:'primary' }} h-100">
    <div class="card-body d-flex justify-content-between align-items-start gap-2">
      <div>
        <div class="card-indicador__titulo">
          {% if url %}<a href="{{ url }}" class="stretched-link text-reset text-decoration-none">{{ titulo }}</a>{% else %}{{ titulo }}{% endif %}
        </div>
        <div class="card-indicador__valor">{{ valor }}</div>
      </div>
      <span class="card-indicador__icone" aria-hidden="true"><i class="bi bi-{{ icone }}"></i></span>
    </div>
  </div>
</div>
