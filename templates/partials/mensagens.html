{% for mensagem in messages %}
  <div class="alert alert-{% if mensagem.tags == 'error' %}danger{% else %}{{ mensagem.tags }}{% endif %} alert-dismissible fade show d-flex gap-2" role="alert">
    <i class="bi bi-{% if mensagem.tags == 'success' %}check-circle{% elif mensagem.tags == 'error' %}exclamation-octagon{% elif mensagem.tags == 'warning' %}exclamation-triangle{% else %}info-circle{% endif %}" aria-hidden="true"></i>
    <div>{{ mensagem }}</div>
    <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Fechar"></button>
  </div>
{% endfor %}
